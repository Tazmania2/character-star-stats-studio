name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: character-star-stats-studio/package-lock.json

      - name: Install dependencies
        working-directory: character-star-stats-studio
        run: npm ci

      - name: Run linter
        working-directory: character-star-stats-studio
        run: npm run lint

      - name: Type check
        working-directory: character-star-stats-studio
        run: npx tsc --noEmit

      - name: Build application
        working-directory: character-star-stats-studio
        run: npm run build

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: character-star-stats-studio/dist
          retention-days: 7
